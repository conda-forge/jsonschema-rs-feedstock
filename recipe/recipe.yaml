# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.58.0"
  maturin_min: "1.0"
  maturin_max: "2.0"
  python_check_max: "3.14"

package:
  name: jsonschema-rs
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/b0/94/b2b290f3dda177b0074e32c1a495260173e77257dd7163d914254b4061a5/jsonschema_rs-${{ version }}.tar.gz
  sha256: 45e0d2e07113eb5da922ea9d9a414da511b858a63bf89dba8a14cc958f7981fe

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO: cargo-auditable-wrapper.${{ "bat" if win else "sh" }}
    content:
    - if: win
      then:
        - copy "%RECIPE_DIR%\%CARGO%" "%BUILD_PREFIX%\Library\bin\"
      else:
        - cp "${RECIPE_DIR}/${CARGO}" "${BUILD_PREFIX}/bin/"
        - chmod 755 "${BUILD_PREFIX}/bin/${CARGO}"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("rust") }}
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses
  host:
    - maturin >=1.0,<2.0
    - pip
    - python
    - if: is_abi3
      then:
        - python-abi3
        - python ${{ python_min }}.*
  run:
    - python
    - if: is_abi3
      then:
        - python-abi3
        - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        -  etc/conda/test-files/jsonschema-rs/**
      site_packages:
        - jsonschema_rs/**
        - jsonschema_rs-${{ version }}.dist-info/**
  - python:
      imports: jsonschema_rs
      pip_check: true
      python_version:
        - if: is_abi3
          then:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
          else:
            - "*"
  - files:
      source:
        - crates/jsonschema-py/tests-py/
    requirements:
      run:
        - flask >=2.2.5
        - hypothesis >=6.79.4
        - pytest >=7.4.4
        - if: is_abi3
          then:
            - abi3audit
            - python ${{ python_min }}.*
    script:
      env:
        PYTHON_MIN: ${{ python_min }}
        IS_ABI3: ${{ is_abi3 }}
      file: run_test.py

about:
  summary: A high-performance JSON Schema validator for Python
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - crates/jsonschema-referencing/LICENSE
    - crates/jsonschema/LICENSE
  homepage: https://pypi.org/project/jsonschema-rs
  repository: https://github.com/Stranger6667/jsonschema

extra:
  recipe-maintainers:
    - bollwyvl
