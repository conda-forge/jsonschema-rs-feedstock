# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.58.6"
  python_check_max: "3.14"
  cargo_auditable_wrapper: cargo-auditable-wrapper.${{ "bat" if win else "sh" }}

package:
  name: jsonschema-rs
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/37/2a/e1f8bf7448c1d88c804ff3f52f1f354999f4b401d17d9167386d9abf9bed/jsonschema_rs-${{ version }}.tar.gz
  sha256: 067140dbbb0e94106212c23ad26c41aff4f5558dbc340b4416b57c1a4f3c537a

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      CARGO: ${{ cargo_auditable_wrapper }}
    content:
      - if: win
        then:
          - copy "%RECIPE_DIR%\${{ cargo_auditable_wrapper }}" "%BUILD_PREFIX%\Library\bin\"
        else:
          - cp "${RECIPE_DIR}/${{ cargo_auditable_wrapper }}" "${BUILD_PREFIX}/bin/"
          - chmod 755 "${BUILD_PREFIX}/bin/${{ cargo_auditable_wrapper }}"
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses
  host:
    - maturin >=1.0,<2.0
    - pip
    - python
    - if: is_abi3
      then:
        - python ${{ python_min }}.*
        - python-abi3
  run:
    - python
    - if: is_abi3
      then:
        - python >=${{ python_min }}
        - python-abi3

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/jsonschema-rs/**
      site_packages:
        - jsonschema_rs/**
        - jsonschema_rs-${{ version }}.dist-info/**
  - python:
      imports:
        - jsonschema_rs
        - jsonschema_rs.jsonschema_rs
      pip_check: true
      python_version:
        - if: is_abi3
          then:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
          else:
            - "*"
  - files:
      source:
        - crates/jsonschema-py/tests-py/
    requirements:
      run:
        - flask >=2.2.5
        - hypothesis >=6.79.4
        - pytest >=7.4.4
        - if: is_abi3
          then:
            - abi3audit
            - python ${{ python_min }}.*
    script:
      env:
        PYTHON_MIN: ${{ python_min }}
        IS_ABI3: ${{ is_abi3 }}
      file: run_test.py

about:
  summary: A high-performance JSON Schema validator for Python
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - crates/jsonschema-referencing/LICENSE
    - crates/jsonschema/LICENSE
  homepage: https://pypi.org/project/jsonschema-rs
  repository: https://github.com/Stranger6667/jsonschema

extra:
  recipe-maintainers:
    - bollwyvl
